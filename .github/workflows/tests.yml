name: Tests

# Called by ci.yml, and can be run on its own from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 3

jobs:
  unit_tests:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Run tests
        run: python -m pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: python -m pip install --upgrade pip build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  smoke_test:
    name: Install built wheel
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wheel
        run: pip install --find-links ./dist/ pip-size
      - name: Smoke test against PyPI
        run: pip-size "requests" --no-deps --json | python -m json.tool
      - name: Smoke test with the local wheel and --skip-installed
        run: |
          pip-size ./dist/pip_size-*.whl --json | python -m json.tool
          pip-size ./dist/pip_size-*.whl --skip-installed --quiet --bytes
