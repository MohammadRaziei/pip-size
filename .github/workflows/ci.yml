name: CI

# The only workflow that runs on repository events. It calls three others, each of which
# can also be run on its own from the Actions tab:
#   tests.yml    unit tests (Python 3.9-3.13), build, smoke test of the built wheel
#   docs.yml     build the documentation site; deploy it to GitHub Pages from master
#   release.yml  GitHub release + PyPI upload, for v* tags only

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  docs:
    name: Docs
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      deploy: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, docs]
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      build: false
    secrets: inherit
