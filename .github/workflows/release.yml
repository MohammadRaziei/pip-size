name: Release

# Called by ci.yml, which has already built and tested the distributions.
# It can also be run on its own: choose a v* tag under "Use workflow from"; it then builds
# the distributions itself.
on:
  workflow_call:
    inputs:
      build:
        description: Build the distributions here instead of using the "dist" artifact of the calling run
        type: boolean
        default: false
    secrets:
      PYPI_USER:
        required: true
      PYPI_PASS:
        required: true
  workflow_dispatch:
    inputs:
      build:
        description: Build the distributions here instead of using a "dist" artifact
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: GitHub release and PyPI upload
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::Run the release from a v* tag (pick it under 'Use workflow from')."
          exit 1
      - uses: actions/checkout@v4
        if: ${{ inputs.build }}
      - uses: actions/setup-python@v5
        if: ${{ inputs.build }}
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        if: ${{ inputs.build }}
        run: python -m pip install --upgrade pip build && python -m build
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.build }}
        with:
          name: dist
          path: dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: ${{ secrets.PYPI_USER }}
          password: ${{ secrets.PYPI_PASS }}
