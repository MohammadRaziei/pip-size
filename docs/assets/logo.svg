<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">pip-size logo: a package being measured</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <clipPath id="top"><polygon points="128,56 176,84 128,112 80,84"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>

  <g transform="translate(128 128) scale(1.18) translate(-120.5 -125.5)">
    <!-- package: isometric box -->
    <polygon points="128,56 176,84 128,112 80,84"    fill="#FFFFFF"/>
    <polygon points="80,84 128,112 128,170 80,142"   fill="#FFFFFF" fill-opacity="0.72"/>
    <polygon points="128,112 176,84 176,142 128,170" fill="#FFFFFF" fill-opacity="0.50"/>
    <!-- tape across the top and down the front corner -->
    <line x1="104" y1="70" x2="152" y2="98" stroke="#4F46E5" stroke-opacity="0.30" stroke-width="13" clip-path="url(#top)"/>

    <!-- measuring line along the bottom-left edge -->
    <g transform="translate(2.5 -4)" stroke="#FFFFFF" stroke-linecap="round" fill="none">
      <line x1="69" y1="161" x2="117" y2="189" stroke-width="5"/>
      <line x1="65.5" y1="167" x2="72.5" y2="155" stroke-width="5"/>
      <line x1="113.5" y1="195" x2="120.5" y2="183" stroke-width="5"/>
      <g stroke-width="3.5" stroke-opacity="0.85">
        <line x1="81" y1="168" x2="78.5" y2="172.5"/>
        <line x1="93" y1="175" x2="90.5" y2="179.5"/>
        <line x1="105" y1="182" x2="102.5" y2="186.5"/>
      </g>
    </g>
  </g>
</svg>
